<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 250px; padding: 15px; font-family: sans-serif; text-align: center; }
        #title { font-weight: bold; color: #333; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Active Page Title</h3>
    <hr>
    <div id="title">Fetching title...</div>
    
    <script>
        chrome.tabs.query({active: true, currentWindow: true}, function(tabs) {
            document.getElementById('title').innerText = tabs[0].title;
        });
    </script>
</body>
</html>
